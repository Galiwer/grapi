apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-quota
  namespace: application
  labels:
    app.kubernetes.io/name: grapi
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "256Mi"
    limits.cpu: "1000m"
    limits.memory: "512Mi"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: application-limits
  namespace: application
  labels:
    app.kubernetes.io/name: grapi
spec:
  limits:
    - type: Container
      default:
        cpu: "200m"
        memory: "128Mi"
      defaultRequest:
        cpu: "50m"
        memory: "32Mi"
