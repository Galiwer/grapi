apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: application

resources:
  - namespace.yaml
  - rbac.yaml
  - quota.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: local-gitops-platform
      app.kubernetes.io/managed-by: kustomize
