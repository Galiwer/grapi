apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-svc.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'gitops-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  gitops-platform.json: |
    {
      "title": "GitOps CI/CD Platform & Go API Overview",
      "uid": "gitops-grapi-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Monitored Targets",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 4 },
                  { "color": "green", "value": 6 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "6": { "text": "6 / 6 ONLINE", "color": "green" }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "count(up == 1)",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Go API Replicas",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "2": { "text": "2 / 2 READY", "color": "green" }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "count(up{job=\"grapi-pods\"} == 1)",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Total HTTP Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": { "fixedColor": "blue", "mode": "fixed" }
            }
          },
          "targets": [
            {
              "expr": "sum(grapi_http_requests_total)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Request Rate (req/s)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": { "fixedColor": "purple", "mode": "fixed" }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(grapi_http_requests_total[1m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Total Go Heap Memory",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "color": { "fixedColor": "orange", "mode": "fixed" }
            }
          },
          "targets": [
            {
              "expr": "sum(grapi_memory_alloc_bytes)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Go API Uptime",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "color": { "fixedColor": "green", "mode": "fixed" }
            }
          },
          "targets": [
            {
              "expr": "max(grapi_uptime_seconds)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Go API HTTP Requests by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull"]
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 25,
                "gradientMode": "opacity",
                "showPoints": "never"
              }
            }
          },
          "targets": [
            {
              "expr": "sum by (endpoint) (grapi_http_requests_total)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Go Runtime Heap Memory per Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["mean", "lastNotNull"]
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 25,
                "gradientMode": "opacity",
                "showPoints": "never"
              }
            }
          },
          "targets": [
            {
              "expr": "grapi_memory_alloc_bytes",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Go Active Goroutines per Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull"]
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 16,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 25,
                "gradientMode": "opacity",
                "showPoints": "never"
              }
            }
          },
          "targets": [
            {
              "expr": "grapi_goroutines",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "Kubernetes Scrape Targets Health (Prometheus, grapi, Traefik, Argo CD)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 14, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "OFFLINE", "color": "red" },
                    "1": { "text": "ONLINE", "color": "green" }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "up",
              "instant": true,
              "legendFormat": "{{job}} • {{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "Argo CD GitOps Applications Live Status",
          "type": "stat",
          "gridPos": { "h": 6, "w": 10, "x": 14, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "orange", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "OUT OF SYNC", "color": "orange" },
                    "1": { "text": "SYNCED & HEALTHY", "color": "green" }
                  }
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "argocd_app_info{sync_status=\"Synced\",health_status=\"Healthy\"}",
              "instant": true,
              "legendFormat": "{{name}} ({{dest_namespace}})",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/gitops-platform.json"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: storage
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-svc
                port:
                  number: 3000
